<!doctype html>
<html lang="vi" class="light">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Photobooth AI - Y2K Edition | KH Booth</title>

    <!-- Google Fonts & Material Symbols -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,800&family=JetBrains+Mono:wght@500&family=Space+Grotesk:wght@400;700&display=swap" />

    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              "inverse-primary": "#8ad0f1",
              "secondary": "#a900a9",
              "surface-variant": "#e3e2e0",
              "on-primary-fixed": "#001f2a",
              "on-error-container": "#93000a",
              "primary-container": "#89cff0",
              "on-primary-fixed-variant": "#004d65",
              "on-secondary-fixed-variant": "#810081",
              "on-secondary-container": "#500050",
              "surface-container-highest": "#e3e2e0",
              "on-background": "#1b1c1b",
              "surface-container": "#efeeec",
              "tertiary-fixed": "#e3e2e2",
              "on-primary-container": "#005974",
              "secondary-fixed": "#ffd7f5",
              "outline-variant": "#bfc8cd",
              "on-tertiary-container": "#515253",
              "error": "#ba1a1a",
              "error-container": "#ffdad6",
              "on-tertiary": "#ffffff",
              "secondary-container": "#fe00fe",
              "surface-container-low": "#f5f3f1",
              "on-secondary": "#ffffff",
              "secondary-fixed-dim": "#ffabf3",
              "inverse-on-surface": "#f2f0ee",
              "background": "#faf9f7",
              "outline": "#70787d",
              "surface-container-lowest": "#ffffff",
              "surface-container-high": "#e9e8e6",
              "on-secondary-fixed": "#380038",

              "on-surface-variant": "#40484d",
              "tertiary-container": "#c6c6c6",
              "on-error": "#ffffff",
              "surface-dim": "#dbdad8",
              "primary-fixed-dim": "#8ad0f1",
              "primary-fixed": "#bee9ff",
              "surface-tint": "#0d6683",
              "surface-bright": "#faf9f7",
              "tertiary-fixed-dim": "#c6c6c6"

              "DEFAULT": "0.25rem",
              "lg": "0.5rem",
              "xl": "0.75rem",

            spacing: {
              "margin-desktop": "40px",
              "unit": "4px",
              "gutter": "16px",
              "margin-mobile": "20px",
              "container-max": "1280px"
            },
            fontFamily: {
              "headline-lg-mobile": ["Space Grotesk", "sans-serif"],
              "body-md": ["Space Grotesk", "sans-serif"],
              "label-mono": ["JetBrains Mono", "monospace"],
              "display-bubble": ["Bricolage Grotesque", "sans-serif"],
              "headline-lg": ["Space Grotesk", "sans-serif"]
            },
            fontSize: {
              "headline-lg-mobile": ["24px", { lineHeight: "30px", fontWeight: "700" }],
              "body-md": ["16px", { lineHeight: "24px", fontWeight: "400" }],

  <body class="font-body-md text-body-md text-on-background min-h-screen relative flex flex-col">
